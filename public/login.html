<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — IT Service Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal.css" />
</head>
<body class="portal">
  <header class="top"><div class="top-inner">
    <a class="site" href="/">Help Desk</a>
    <nav><a href="/">Home</a></nav>
  </div></header>
  <div class="crumbs"><div class="crumbs-inner"><a href="/">IT Service Desk</a><i>›</i><a href="/">Help Desk</a><i>›</i><span>Login</span></div></div>

  <main class="login-wrap">
    <div class="login-card">
      <h1>Sign in</h1>
      <p class="sub">Customers and support staff sign in here.</p>
      <form id="loginForm" novalidate>
        <label>Email<input name="email" type="email" autocomplete="username" required autofocus /></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
        <p class="err" id="loginError" role="alert"></p>
        <button class="btn" type="submit" id="loginBtn">Sign in</button>
      </form>
      <div class="login-note">There is no public sign-up. Your account is created by the service desk administrator. If you cannot sign in, ask them to create or reset your account.</div>
    </div>
    <p class="login-back"><a href="/">← Back to the help desk</a></p>
  </main>
  <script src="/login.js"></script>
</body>
</html>
